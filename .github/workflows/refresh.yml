# Weekly refresh: pull new CFPB complaints, rebuild the analysis, redeploy the site.
# Needs repo secrets DATABASE_URL, ANTHROPIC_API_KEY and FIREBASE_SERVICE_ACCOUNT (JSON),
# plus the repo variable FIREBASE_PROJECT_ID. Until they exist, the job skips itself.
name: Refresh data and deploy

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m earshot run
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build
        working-directory: web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
